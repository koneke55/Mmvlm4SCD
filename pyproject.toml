[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmvlm4scd"
version = "0.1.0"
description = "Multimodal model for Sickle Cell Disease severity and survival prediction"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sambou Kone" }]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "lifelines>=0.27",
  "torch>=2.1",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
mmvlm4scd-train = "mmvlm4scd.scripts_entry:train_main"
mmvlm4scd-evaluate = "mmvlm4scd.scripts_entry:evaluate_main"
mmvlm4scd-experiment = "mmvlm4scd.scripts_entry:experiment_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
