[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmvlm4scd"
version = "0.1.1"
description = "Multimodal model for Sickle Cell Disease severity and survival prediction"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sambou Kone" }]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "lifelines>=0.27",
  "torch>=2.1",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "pre-commit>=3.5"]
hf = ["huggingface_hub>=0.20", "safetensors>=0.4"]

[project.scripts]
mmvlm4scd-train = "mmvlm4scd.scripts_entry:train_main"
mmvlm4scd-evaluate = "mmvlm4scd.scripts_entry:evaluate_main"
mmvlm4scd-experiment = "mmvlm4scd.scripts_entry:experiment_main"
mmvlm4scd-push-hf = "mmvlm4scd.cli.hf_hub_push:main"
mmvlm4scd-infer-hf-config = "mmvlm4scd.cli.infer_hf_config:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".venv", "experiments/results", "notebooks"]

[tool.ruff.lint]
# Curated rule set focused on correctness, not style.
# - F   : pyflakes (undefined names, unused imports, redefinitions)
# - E4  : import-related errors
# - E9  : syntax/runtime errors
# - E7xx (curated) : comparison, exception and typing footguns
# - W6  : deprecation warnings
# Stylistic rules (E701/E702/E703 semicolons, E731 lambda) are
# intentionally omitted to match the existing matplotlib-heavy code.
select = [
    "F",
    "E4",
    "E9",
    "E711",
    "E712",
    "E713",
    "E714",
    "E721",
    "E722",
    "E741",
    "W6",
]

[tool.ruff.lint.per-file-ignores]
# Entry-point scripts mutate sys.path before importing project modules,
# which is a legitimate exception to E402 (module-level imports).
"src/scripts/*.py" = ["E402"]
